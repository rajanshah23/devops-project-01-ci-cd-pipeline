# ==========================================================
# API CI PIPELINE (PRODUCTION GRADE)
# ==========================================================
# Purpose:
# This pipeline automatically checks the API whenever code
# is pushed to the main branch or a pull request is created.
#
# CI (Continuous Integration):
# Automatically lints, tests, and generates coverage reports
# to identify errors before code is merged into main.
# ==========================================================

name: API CI Pipeline

# ==========================================================
# PIPELINE TRIGGERS
# ==========================================================
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# ==========================================================
# JOBS
# ==========================================================
jobs:

  # ========================================================
  # JOB 1: LINTING
  # ========================================================
  # Checks code for syntax errors, bad formatting, and bugs.
  # Runs in parallel with the build-and-test job to save time.
  lint:
    runs-on: ubuntu-latest
    steps:
    # STEP 1: CHECKOUT SOURCE CODE
    - name: Checkout Code
      uses: actions/checkout@v4

    # STEP 2: SETUP NODE.JS (WITH CACHING)
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm' # Caches dependencies to speed up future runs

    # STEP 3: INSTALL PROJECT DEPENDENCIES
    # Using 'npm ci' for deterministic, fast, production-ready installs
    - name: Install Dependencies
      run: npm ci

    # STEP 4: RUN LINTER
    - name: Run ESLint
      run: npm run lint

  # ========================================================
  # JOB 2: BUILD AND TEST
  # ========================================================
  build-and-test:
    runs-on: ubuntu-latest
    steps:

    # STEP 1: CHECKOUT SOURCE CODE
    - name: Checkout Code
      uses: actions/checkout@v4

    # STEP 2: SETUP NODE.JS (WITH CACHING)
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    # STEP 3: INSTALL PROJECT DEPENDENCIES
    # 'npm ci' strictly uses package-lock.json for deterministic builds
    - name: Install Dependencies
      run: npm ci

    # STEP 4: RUN API TESTS WITH COVERAGE
    # We modified the test script in package.json to use nyc
    - name: Run API Tests
      run: npm test

    # STEP 5: UPLOAD COVERAGE REPORT AS ARTIFACT
    # Saves the HTML coverage report so you can download it from GitHub
    - name: Upload Coverage Report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage/
        retention-days: 5