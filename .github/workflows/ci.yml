
# ==========================================================
# API CI PIPELINE
# ==========================================================
# Purpose:
# This pipeline automatically checks the API whenever code
# is pushed to the main branch or a pull request is created.
#
# CI (Continuous Integration):
# Automatically installs dependencies and runs API tests
# to identify errors before code is merged into main.
# ==========================================================

# Name displayed in the GitHub Actions workflow dashboard.
name: API CI Pipeline


# ==========================================================
# PIPELINE TRIGGERS
# ==========================================================
# Define the GitHub events that trigger this workflow.

on:

  # Trigger the pipeline whenever code is pushed to main.
  push:
    branches: [ "main" ]

  # Trigger the pipeline whenever a pull request targets main.
  # This helps verify changes before merging them into main.
  pull_request:
    branches: [ "main" ]


# ==========================================================
# JOBS
# ==========================================================
# Jobs define the tasks that GitHub Actions must execute.
jobs:

  # Job identifier: build-and-test
  # This job installs dependencies and executes API tests.
  build-and-test:

    # Select the GitHub-hosted Ubuntu virtual machine.
    # The job runs inside a fresh Ubuntu environment.
    runs-on: ubuntu-latest


    # ========================================================
    # STEPS
    # ========================================================
    # Steps are executed sequentially inside this job.
    steps:

    # --------------------------------------------------------
    # STEP 1: CHECKOUT SOURCE CODE
    # --------------------------------------------------------
    # Download the repository code into the GitHub Actions runner.
    # Without this step, the runner cannot access your project files.
    - name: Checkout Code
      uses: actions/checkout@v4


    # --------------------------------------------------------
    # STEP 2: SETUP NODE.JS
    # --------------------------------------------------------
    # Install and configure Node.js version 18.
    # This ensures the application runs using the expected
    # Node.js runtime environment.
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'


    # --------------------------------------------------------
    # STEP 3: INSTALL PROJECT DEPENDENCIES
    # --------------------------------------------------------
    # Install the packages defined in package.json.
    # These dependencies are required to run and test the API.
    - name: Install Dependencies
      run: npm install


    # --------------------------------------------------------
    # STEP 4: RUN API TESTS
    # --------------------------------------------------------
    # Execute the test script defined in package.json.
    # If tests fail, this step returns a non-zero exit code,
    # causing the GitHub Actions job to fail.
    - name: Run API Tests
      run: npm test
